<title>Skudo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;700&family=Inter:wght@400;500;600&display=swap">
<style>
:root {
  --ink: #1a1d23;
  --ink-secondary: #6b7280;
  --surface: #f5f6f8;
  --card: #ffffff;
  --accent: #2563eb;
  --accent-light: #dbeafe;
  --positive: #059669;
  --positive-light: #d1fae5;
  --warning: #d97706;
  --warning-light: #fef3c7;
  --critical: #dc2626;
  --critical-light: #fee2e2;
  --border: #e5e7eb;
  --radius: 10px;
  --shadow: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
  --font-display: 'DM Sans', system-ui, sans-serif;
  --font-body: 'Inter', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ink: #e5e7eb;
    --ink-secondary: #9ca3af;
    --surface: #111318;
    --card: #1a1d24;
    --accent: #60a5fa;
    --accent-light: #1e3a5f;
    --positive: #34d399;
    --positive-light: #064e3b;
    --warning: #fbbf24;
    --warning-light: #78350f;
    --critical: #f87171;
    --critical-light: #7f1d1d;
    --border: #2d3039;
    --shadow: 0 1px 3px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"] {
  --ink: #e5e7eb;
  --ink-secondary: #9ca3af;
  --surface: #111318;
  --card: #1a1d24;
  --accent: #60a5fa;
  --accent-light: #1e3a5f;
  --positive: #34d399;
  --positive-light: #064e3b;
  --warning: #fbbf24;
  --warning-light: #78350f;
  --critical: #f87171;
  --critical-light: #7f1d1d;
  --border: #2d3039;
  --shadow: 0 1px 3px rgba(0,0,0,.3);
}
*, *::before, *::after { box-sizing: border-box; }
body {
  background: var(--surface);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 14px;
  line-height: 1.5;
  margin: 0;
  min-height: 100vh;
}
::selection { background: var(--accent-light); color: var(--ink); }

/* --- Login screen --- */
/* El atributo `hidden` debe ganar sobre las reglas de clase con `display`:
   sin esto, `.login-screen`/`.app` (display:flex) tapan el `display:none` del
   user-agent y ocultar el login con hidden=true no hace nada. */
[hidden] { display: none !important; }

.login-screen {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 20px;
}
.login-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 40px;
  width: 100%;
  max-width: 380px;
}
.login-card h1 {
  font-family: var(--font-display);
  font-size: 1.5rem;
  font-weight: 700;
  margin: 0 0 4px;
  letter-spacing: -0.02em;
}
.login-card p {
  color: var(--ink-secondary);
  margin: 0 0 28px;
  font-size: 13px;
}
.login-card label {
  display: block;
  font-weight: 500;
  font-size: 13px;
  margin-bottom: 6px;
  color: var(--ink-secondary);
}
.login-card input {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: 6px;
  font-family: var(--font-body);
  font-size: 14px;
  background: var(--surface);
  color: var(--ink);
  margin-bottom: 16px;
  outline: none;
  transition: border-color .15s;
}
.login-card input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-light);
}
.login-btn {
  width: 100%;
  padding: 10px;
  border: none;
  border-radius: 6px;
  background: var(--accent);
  color: #fff;
  font-family: var(--font-body);
  font-weight: 600;
  font-size: 14px;
  cursor: pointer;
  transition: opacity .15s;
}
.login-btn:hover { opacity: .9; }
.login-btn:disabled { opacity: .5; cursor: not-allowed; }
.login-error {
  color: var(--critical);
  font-size: 13px;
  margin-top: 12px;
  min-height: 20px;
}

/* --- App shell --- */
.app { display: flex; min-height: 100vh; }
.sidebar {
  width: 240px;
  background: var(--card);
  border-right: 1px solid var(--border);
  padding: 20px 0;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
}
.sidebar-brand {
  padding: 0 20px 20px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 12px;
}
.sidebar-brand h2 {
  font-family: var(--font-display);
  font-size: 1.2rem;
  font-weight: 700;
  margin: 0;
  letter-spacing: -0.02em;
}
.sidebar-brand span {
  font-size: 11px;
  color: var(--ink-secondary);
}
.sidebar nav { flex: 1; padding: 0 8px; }
.sidebar nav a {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 12px;
  border-radius: 6px;
  color: var(--ink-secondary);
  text-decoration: none;
  font-size: 13px;
  font-weight: 500;
  transition: background .1s, color .1s;
  cursor: pointer;
}
.sidebar nav a:hover { background: var(--surface); color: var(--ink); }
.sidebar nav a.active { background: var(--accent-light); color: var(--accent); }
.sidebar nav a svg { width: 18px; height: 18px; flex-shrink: 0; }
.sidebar-footer {
  padding: 12px 20px 0;
  border-top: 1px solid var(--border);
  margin-top: auto;
}
.sidebar-footer .user-info {
  font-size: 12px;
  color: var(--ink-secondary);
  margin-bottom: 8px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.sidebar-footer button {
  background: none;
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 6px 12px;
  font-size: 12px;
  color: var(--ink-secondary);
  cursor: pointer;
  font-family: var(--font-body);
  width: 100%;
}
.sidebar-footer button:hover { background: var(--surface); color: var(--ink); }

.main { flex: 1; overflow-x: auto; padding: 28px 32px; max-width: calc(100vw - 240px); }
.main-header {
  display: flex;
  align-items: baseline;
  gap: 16px;
  margin-bottom: 24px;
}
.main-header h1 {
  font-family: var(--font-display);
  font-size: 1.4rem;
  font-weight: 700;
  margin: 0;
  letter-spacing: -0.02em;
}
.main-header .store-select {
  font-size: 13px;
  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--card);
  color: var(--ink);
  font-family: var(--font-body);
}

/* --- Health hero --- */
.hero-strip {
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 24px;
  align-items: center;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 24px 28px;
  margin-bottom: 20px;
}
.health-score {
  display: flex;
  align-items: baseline;
  gap: 12px;
}
.health-score .number {
  font-family: var(--font-display);
  font-size: 3.5rem;
  font-weight: 700;
  line-height: 1;
  letter-spacing: -0.03em;
  font-variant-numeric: tabular-nums;
}
.health-score .grade {
  font-family: var(--font-display);
  font-size: 1.5rem;
  font-weight: 700;
  padding: 4px 12px;
  border-radius: 6px;
  line-height: 1;
}
.grade-A { background: var(--positive-light); color: var(--positive); }
.grade-B { background: var(--accent-light); color: var(--accent); }
.grade-C { background: var(--warning-light); color: var(--warning); }
.grade-D { background: var(--warning-light); color: var(--warning); }
.grade-E { background: var(--critical-light); color: var(--critical); }

.health-meta {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.health-meta .delta {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 1rem;
  display: inline-flex;
  align-items: center;
  gap: 4px;
}
.delta.up { color: var(--positive); }
.delta.down { color: var(--critical); }
.delta.flat { color: var(--ink-secondary); }
.health-meta .timestamp {
  color: var(--ink-secondary);
  font-size: 12px;
}
.health-meta .products-count {
  font-size: 13px;
  color: var(--ink-secondary);
}

.distribution-bar {
  display: flex;
  height: 36px;
  border-radius: 6px;
  overflow: hidden;
  min-width: 200px;
  max-width: 320px;
}
.distribution-bar div {
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-display);
  font-size: 11px;
  font-weight: 700;
  color: #fff;
  min-width: 0;
  transition: flex .3s;
}
.dist-A { background: var(--positive); }
.dist-B { background: var(--accent); }
.dist-C { background: var(--warning); }
.dist-D { background: #b45309; }
.dist-E { background: var(--critical); }
.distribution-legend {
  display: flex;
  gap: 12px;
  margin-top: 8px;
  font-size: 11px;
  color: var(--ink-secondary);
}
.distribution-legend span {
  display: flex;
  align-items: center;
  gap: 4px;
}
.distribution-legend .dot {
  width: 8px;
  height: 8px;
  border-radius: 2px;
  flex-shrink: 0;
}

/* --- Rules tile (dashboard) --- */
.rules-tile {
  display: flex;
  align-items: center;
  gap: 12px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 14px 20px;
  margin-bottom: 20px;
  cursor: pointer;
  transition: border-color .15s, box-shadow .15s;
}
.rules-tile:hover { border-color: var(--accent); box-shadow: 0 2px 8px rgba(37,99,235,.1); }
.rules-tile .rules-tile-icon { display: flex; color: var(--accent); flex-shrink: 0; }
.rules-tile .rules-tile-icon svg { width: 20px; height: 20px; }
.rules-tile .rules-tile-text { font-size: 13px; color: var(--ink-secondary); }
.rules-tile .rules-tile-text strong {
  color: var(--ink);
  font-family: var(--font-display);
  font-weight: 700;
}
.rules-tile .rules-tile-arrow { margin-left: auto; color: var(--ink-secondary); }

/* --- Two-column grid --- */
.grid-2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  margin-bottom: 20px;
}
@media (max-width: 900px) {
  .grid-2 { grid-template-columns: 1fr; }
  .hero-strip { grid-template-columns: 1fr; }
}

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 20px;
}
.card-title {
  font-family: var(--font-display);
  font-size: .875rem;
  font-weight: 700;
  margin: 0 0 16px;
  letter-spacing: -0.01em;
}

/* --- Trend chart --- */
.chart-container {
  position: relative;
  height: 180px;
}
.chart-container canvas {
  width: 100% !important;
  height: 100% !important;
}

/* --- Comparison card --- */
.comparison-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
.comp-item {
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: 12px;
  background: var(--surface);
  border-radius: 8px;
}
.comp-item .comp-label {
  font-size: 11px;
  font-weight: 500;
  color: var(--ink-secondary);
  text-transform: uppercase;
  letter-spacing: 0.04em;
}
.comp-item .comp-value {
  font-family: var(--font-display);
  font-size: 1.5rem;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}
.comp-value.positive { color: var(--positive); }
.comp-value.negative { color: var(--critical); }
.comp-value.neutral { color: var(--ink-secondary); }

/* --- Findings table --- */
.findings-table {
  width: 100%;
  border-collapse: collapse;
  font-variant-numeric: tabular-nums;
}
.findings-table th {
  text-align: left;
  font-size: 11px;
  font-weight: 600;
  color: var(--ink-secondary);
  text-transform: uppercase;
  letter-spacing: 0.04em;
  padding: 8px 12px;
  border-bottom: 2px solid var(--border);
}
.findings-table td {
  padding: 10px 12px;
  border-bottom: 1px solid var(--border);
  font-size: 13px;
}
.findings-table tr:last-child td { border-bottom: none; }
.severity-badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.02em;
}
.sev-alta { background: var(--critical-light); color: var(--critical); }
.sev-media { background: var(--warning-light); color: var(--warning); }
.sev-baja { background: var(--accent-light); color: var(--accent); }
.sev-candidato { background: var(--surface); color: var(--ink-secondary); border: 1px solid var(--border); }
.sev-aviso { background: var(--surface); color: var(--ink-secondary); border: 1px solid var(--border); }

.impact-bar {
  height: 4px;
  border-radius: 2px;
  background: var(--border);
  min-width: 60px;
  max-width: 120px;
}
.impact-bar-fill {
  height: 100%;
  border-radius: 2px;
  transition: width .3s;
}

/* --- Origin / status badges (reuse .severity-badge sizing) --- */
.origin-inferida { background: var(--accent-light); color: var(--accent); }
.origin-piso_externo { background: var(--surface); color: var(--ink-secondary); border: 1px solid var(--border); }
.origin-curada { background: var(--positive-light); color: var(--positive); }
.rule-status-aceptada { background: var(--positive-light); color: var(--positive); }
.rule-status-aviso { background: var(--warning-light); color: var(--warning); }
.rule-status-borrador { background: var(--surface); color: var(--ink-secondary); border: 1px solid var(--border); }
.origen-detector { background: var(--surface); color: var(--ink-secondary); border: 1px solid var(--border); }
.origen-regla { background: var(--accent-light); color: var(--accent); }
.rule-status-rechazada { background: var(--critical-light); color: var(--critical); }
.rule-draft-note {
  font-size: 11px;
  color: var(--ink-secondary);
  margin-top: 4px;
}

/* --- Vitrina (stock/visibilidad) badges --- */
.vitrina-pleno { background: var(--positive-light); color: var(--positive); }
.vitrina-sinstock { background: var(--warning-light); color: var(--warning); }
.vitrina-desconocido { background: var(--surface); color: var(--ink-secondary); border: 1px solid var(--border); }

/* --- Curación de reglas --- */
.section-intro {
  color: var(--ink-secondary);
  font-size: 14px;
  line-height: 1.5;
  max-width: 70ch;
  margin: -12px 0 16px;
}
.ayuda-panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  margin-bottom: 20px;
  overflow: hidden;
}
.ayuda-panel > summary {
  cursor: pointer;
  padding: 12px 16px;
  font-weight: 600;
  font-size: 14px;
  color: var(--ink);
  list-style: none;
  display: flex;
  align-items: center;
  gap: 8px;
  user-select: none;
}
.ayuda-panel > summary::-webkit-details-marker { display: none; }
.ayuda-panel > summary::before {
  content: '▸';
  color: var(--accent);
  transition: transform .15s;
}
.ayuda-panel[open] > summary::before { transform: rotate(90deg); }
.ayuda-panel > summary:hover { color: var(--accent); }
.ayuda-cuerpo {
  padding: 4px 16px 16px;
  border-top: 1px solid var(--border);
  font-size: 14px;
  line-height: 1.6;
  color: var(--ink-secondary);
  max-width: 78ch;
}
.ayuda-cuerpo p { margin: 12px 0; }
.ayuda-cuerpo strong { color: var(--ink); }
.ayuda-cuerpo h4 {
  margin: 18px 0 8px;
  font-size: 13px;
  text-transform: uppercase;
  letter-spacing: .04em;
  color: var(--ink);
}
.ayuda-lista { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; }
.ayuda-lista li { display: flex; align-items: baseline; gap: 10px; }
.ayuda-lista li .severity-badge { flex-shrink: 0; }
.ayuda-nota {
  background: var(--accent-light);
  color: var(--ink);
  border-radius: 8px;
  padding: 10px 14px;
  font-size: 13px;
}
.rules-summary {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 16px;
}
.rule-actions {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}
.rule-btn {
  font-family: var(--font-body);
  font-size: 12px;
  font-weight: 600;
  padding: 4px 10px;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--ink);
  cursor: pointer;
  transition: background .12s, border-color .12s;
}
.rule-btn:hover { background: var(--surface); }
.rule-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.btn-accept { border-color: var(--positive); color: var(--positive); }
.btn-accept:hover { background: var(--positive-light); }
.btn-limit { border-color: var(--warning); color: var(--warning); }
.btn-limit:hover { background: var(--warning-light); }
.btn-reject { border-color: var(--critical); color: var(--critical); }
.btn-reject:hover { background: var(--critical-light); }
.btn-snapshot {
  font-family: var(--font-body);
  font-size: 13px;
  font-weight: 600;
  padding: 6px 14px;
  border-radius: 8px;
  border: 1px solid var(--accent);
  background: var(--accent);
  color: #fff;
  cursor: pointer;
}
.btn-snapshot:hover { filter: brightness(1.05); }
.btn-snapshot:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn-nueva {
  margin-left: auto;
  font-family: var(--font-body);
  font-size: 13px;
  font-weight: 600;
  padding: 6px 14px;
  border-radius: 8px;
  border: 1px solid var(--accent);
  background: transparent;
  color: var(--accent);
  cursor: pointer;
}
.btn-nueva:hover { background: var(--accent-light); }
.btn-nueva:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* --- Formulario de nueva regla --- */
.nueva-regla-form {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 20px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.nueva-regla-form .form-row {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  align-items: flex-end;
}
.nueva-regla-form label {
  display: flex;
  flex-direction: column;
  gap: 4px;
  font-size: 12px;
  font-weight: 600;
  color: var(--ink-secondary);
}
.nueva-regla-form label.grow { flex: 1; min-width: 200px; }
.nueva-regla-form input,
.nueva-regla-form select {
  font-family: var(--font-body);
  font-size: 14px;
  font-weight: 400;
  padding: 6px 10px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--card);
  color: var(--ink);
}
.nueva-regla-form input:focus,
.nueva-regla-form select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.nueva-regla-form .form-actions { display: flex; gap: 8px; }
.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(12px);
  background: var(--ink);
  color: var(--card);
  padding: 10px 18px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 500;
  box-shadow: var(--shadow);
  opacity: 0;
  pointer-events: none;
  transition: opacity .2s, transform .2s;
  z-index: 1000;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.toast-error { background: var(--critical); color: #fff; }

/* --- Products table --- */
.products-header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 12px;
  flex-wrap: wrap;
}
.filter-btn {
  padding: 4px 10px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--card);
  color: var(--ink-secondary);
  font-size: 12px;
  font-family: var(--font-body);
  cursor: pointer;
  font-weight: 500;
}
.filter-btn.active {
  background: var(--accent-light);
  color: var(--accent);
  border-color: var(--accent);
}

/* --- Tenant list --- */
.tenant-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 16px;
}
.tenant-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 20px;
  cursor: pointer;
  transition: box-shadow .15s, border-color .15s;
}
.tenant-card:hover { border-color: var(--accent); box-shadow: 0 2px 8px rgba(37,99,235,.1); }
.tenant-card h3 {
  font-family: var(--font-display);
  font-size: 1rem;
  font-weight: 700;
  margin: 0 0 4px;
}
.tenant-card .tenant-url {
  font-size: 12px;
  color: var(--ink-secondary);
  margin-bottom: 12px;
}
.tenant-card .tenant-health {
  display: flex;
  align-items: baseline;
  gap: 8px;
}
.tenant-card .tenant-health .th-num {

<script>
const API = (() => {
  const base = window.location.origin;
  let token = localStorage.getItem('skudo_token');
  let userInfo = null;
  try { userInfo = JSON.parse(localStorage.getItem('skudo_user')); } catch {}

  async function request(path, opts = {}) {
    const headers = { 'Content-Type': 'application/json', ...opts.headers };
    if (token) headers['Authorization'] = `Bearer ${token}`;
    const res = await fetch(`${base}${path}`, { ...opts, headers });
    if (res.status === 401) { logout(); throw new Error('Sesión expirada'); }
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      const detail = body.detail;
      const msg = (detail && typeof detail === 'object')
        ? (detail.message || `Error ${res.status}`)
        : (detail || `Error ${res.status}`);
      const err = new Error(msg);
      err.status = res.status;
      err.detail = detail;
      throw err;
    }
    return res.json();
  }

  function login(t, user) {
    token = t;
    userInfo = user;
    localStorage.setItem('skudo_token', t);
    localStorage.setItem('skudo_user', JSON.stringify(user));
  }

  function logout() {
    token = null;
    userInfo = null;
    localStorage.removeItem('skudo_token');
    localStorage.removeItem('skudo_user');
  }

  return {
    get: (p) => request(p),
    post: (p, d) => request(p, { method: 'POST', body: JSON.stringify(d) }),
    login, logout,
    get token() { return token; },
    get user() { return userInfo },
  };
})();

const LABELS = {
  sin_imagen: 'Sin imagen',
  sin_precio: 'Sin precio',
  sin_descripcion: 'Sin descripción',
  sin_descripcion_corta: 'Sin descripción corta',
  sin_meta_title: 'Sin meta title',
  sin_categoria: 'Sin categoría',
  nombre_en_mayusculas: 'Nombre en mayúsculas',
  nombre_repetido: 'Nombre repetido',
  variantes_sueltas: 'Variantes sueltas (por talle)',
  variantes_por_talle: 'Variantes por talle',
  duplicado: 'Posible duplicado',
  sospecha_conversion: 'Posible conversión de unidad',
  nombre_fuera_de_plantilla: 'Nombre fuera de la plantilla',
  nombre_con_basura: 'Basura en el nombre',
  nombre_es_codigo: 'El nombre es un código',
  campos_basura: 'Campos con comodín de carga',
  marca_inconsistente: 'Marca inconsistente',
  gtin_invalido: 'GTIN mal cargado',
  valores_negativos: 'Valores negativos',
};

// Los códigos dinámicos (filtro_ciego:<attr>, regla:<kind>:<attr>) no están en
// LABELS: se arman legibles a partir de sus partes.
function etiquetaCodigo(code) {
  if (LABELS[code]) return LABELS[code];
  if (!code) return '—';
  if (code.startsWith('filtro_ciego:')) return `Filtro vacío: ${code.slice('filtro_ciego:'.length)}`;
  if (code.startsWith('regla:')) {
    const [, kind, ...rest] = code.split(':');
    const tipo = { obligatoriedad: 'Obligatorio', rango: 'Rango', formato: 'Formato' }[kind] || kind;
    return `${tipo}: ${rest.join(':')}`;
  }
  return code;
}

const state = { tenant: null, store: null, view: 'tenants' };

// --- Render functions ---

function el(tag, attrs, ...children) {
  const e = document.createElement(tag);
  if (attrs) for (const [k,v] of Object.entries(attrs)) {
    if (k === 'style' && typeof v === 'object') Object.assign(e.style, v);
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v);
  }
  for (const c of children) {
    if (c == null) continue;
    e.append(typeof c === 'string' ? document.createTextNode(c) : c);
  }
  return e;
}

function gradeClass(g) { return `grade-${g}`; }
function gradoTitle(g) {
  const i = (typeof GRADOS !== 'undefined') && GRADOS[g];
  return i ? `Grado ${g}: ${i.label} (nota ${i.rango} de 100)` : `Grado ${g}`;
}
function sevClass(s) { return `sev-${s}`; }

const VITRINA = {
  pleno: { label: 'Con stock', clase: 'vitrina-pleno' },
  sin_stock: { label: 'Sin stock · visible', clase: 'vitrina-sinstock' },
};
function vitrinaBadge(p) {
  const info = VITRINA[p.prioridad_vitrina];
  if (!info) return el('span', { class: 'severity-badge vitrina-desconocido', title: 'No hay datos de stock sincronizados para este producto.' }, 'Stock desconocido');
  return el('span', { class: `severity-badge ${info.clase}`, title: p.prioridad_vitrina === 'sin_stock' ? 'Sin stock, pero Magento lo muestra: cuenta con menor prioridad.' : 'Con stock: prioridad plena.' }, info.label);
}

function deltaArrow(d) {
  if (d > 0) return '↑';
  if (d < 0) return '↓';
  return '→';
}
function deltaDir(d) {
  if (d > 0) return 'up';
  if (d < 0) return 'down';
  return 'flat';
}

function formatDate(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleDateString('es', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
}

function renderLoading() {
  return el('div', { class: 'loading' }, el('div', { class: 'spinner' }), 'Cargando...');
}

// --- Views ---

async function renderTenants() {
  const main = document.getElementById('main-content');
  main.innerHTML = '';
  main.append(
    el('div', { class: 'main-header' }, el('h1', null, 'Tenants')),
    renderLoading()
  );

  try {
    const tenants = await API.get('/api/tenants');
    main.innerHTML = '';
    main.append(el('div', { class: 'main-header' }, el('h1', null, 'Tenants')));

    if (!tenants.length) {
      main.append(el('div', { class: 'empty-state' }, el('p', null, 'No hay tenants registrados.')));
      return;
    }

    const grid = el('div', { class: 'tenant-grid' });
    for (const t of tenants) {
      const card = el('div', { class: 'tenant-card', onclick: () => selectTenant(t) },
        el('h3', null, t.name || t.code),
        el('div', { class: 'tenant-url' }, t.base_url || t.code),
        el('div', { class: 'tenant-health' },
          t.ultima_salud != null
            ? el('span', { class: 'th-num' }, String(t.ultima_salud))
            : el('span', { class: 'th-num', style: { color: 'var(--ink-secondary)', fontSize: '1rem' } }, 'Sin datos'),
          t.ultimo_grado
            ? el('span', { class: `grade ${gradeClass(t.ultimo_grado)}`, title: gradoTitle(t.ultimo_grado), style: { padding: '2px 8px', borderRadius: '4px', fontFamily: 'var(--font-display)', fontWeight: '700', fontSize: '.875rem' } }, t.ultimo_grado)
            : null,
          t.criticos
            ? el('span', { style: { color: 'var(--critical)', fontSize: '12px', fontWeight: '500' } }, `${t.criticos} no publicables`)
            : null
        ),
        t.medido_en ? el('div', { style: { fontSize: '11px', color: 'var(--ink-secondary)', marginTop: '8px' } }, formatDate(t.medido_en)) : null
      );
      grid.append(card);
    }
    main.append(grid);
  } catch (e) {
    main.innerHTML = '';
    main.append(el('div', { class: 'empty-state' }, el('p', null, `Error: ${e.message}`)));
  }
}

function selectTenant(t) {
  state.tenant = t;
  state.store = t.store_views?.[0] || null;
  document.getElementById('nav-dashboard').hidden = false;
  document.getElementById('nav-findings').hidden = false;
  document.getElementById('nav-rules').hidden = false;
  document.getElementById('nav-products').hidden = false;
  document.getElementById('nav-catalog-design').hidden = false;
  navigate('dashboard');
}

async function renderDashboard() {
  const main = document.getElementById('main-content');
  main.innerHTML = '';
  if (!state.tenant || state.store == null) {
    main.append(el('div', { class: 'empty-state' }, el('p', null, 'Selecciona un tenant primero.')));
    return;
  }

  const header = el('div', { class: 'main-header' },
    el('h1', null, state.tenant.name || state.tenant.code),
  );
  if (state.tenant.store_views?.length > 1) {
    const sel = el('select', { class: 'store-select', onchange: (e) => { state.store = Number(e.target.value); renderDashboard(); } });
    for (const sv of state.tenant.store_views) {
      const opt = el('option', { value: sv }, `Store view ${sv}`);
      if (sv === state.store) opt.selected = true;
      sel.append(opt);
    }
    header.append(sel);
  }
  main.append(header, renderLoading());

  try {
    const health = await API.get(`/api/tenants/${state.tenant.code}/health?store=${state.store}`);
    const sv = health[String(state.store)];
    if (!sv || sv.salud == null) {
      main.querySelector('.loading').replaceWith(el('div', { class: 'empty-state' }, el('p', null, 'Sin datos de salud para esta store view.')));
      return;
    }

    const loading = main.querySelector('.loading');
    if (loading) loading.remove();

    // Hero strip
    const comp = sv.comparacion;
    const delta = comp ? comp.delta_salud : null;
    const heroStrip = el('div', { class: 'hero-strip' },
      el('div', { class: 'health-score' },
        el('span', { class: 'number' }, String(sv.salud)),
        el('span', { class: `grade ${gradeClass(sv.grado)}`, title: gradoTitle(sv.grado) }, sv.grado),
      ),
      el('div', { class: 'health-meta' },
        delta != null
          ? el('span', { class: `delta ${deltaDir(delta)}` }, `${deltaArrow(delta)} ${delta > 0 ? '+' : ''}${delta} vs anterior`)
          : el('span', { class: 'delta flat' }, 'Primera medición'),
        el('span', { class: 'products-count' }, `${sv.productos} productos evaluados`),
        sv.criticos ? el('span', { style: { color: 'var(--critical)', fontSize: '13px', fontWeight: '500' } }, `${sv.criticos} no publicables`) : null,
        el('span', { class: 'timestamp' }, formatDate(sv.medido_en)),
      ),
      renderDistribution(sv.distribucion, sv.productos),
    );
    main.append(heroStrip);

    // Reglas activas tile (best-effort: si /rules falla, el dashboard no se cae)
    try {
      const rules = await API.get(`/api/tenants/${state.tenant.code}/rules?store=${state.store}`);
      const counts = { aceptada: 0, aviso: 0, borrador: 0 };
      for (const r of (rules || [])) counts[r.status] = (counts[r.status] || 0) + 1;
      const activas = counts.aceptada + counts.aviso;
      const icon = el('span', { class: 'rules-tile-icon' });
      icon.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l7 3v6c0 5-3.5 8-7 9-3.5-1-7-4-7-9V6l7-3z"/><path d="M9 12l2 2 4-4"/></svg>';
      main.append(el('div', { class: 'rules-tile', onclick: () => navigate('rules') },
        icon,
        el('span', { class: 'rules-tile-text' },
          el('strong', null, `${activas} activas`),
          ` · ${counts.aceptada} aceptadas · ${counts.aviso} aviso`,
          counts.borrador ? ` · ${counts.borrador} borrador` : '',
        ),
        el('span', { class: 'rules-tile-arrow' }, '→'),
      ));
    } catch { /* sin reglas o endpoint no disponible: tile omitido */ }

    // Two-column grid
    const grid = el('div', { class: 'grid-2' });

    // Trend chart
    const trendCard = el('div', { class: 'card' },
      el('h3', { class: 'card-title' }, 'Evolución de salud'),
      el('div', { class: 'chart-container' }, el('canvas', { id: 'trend-chart' })),
    );
    grid.append(trendCard);

    // Comparison card
    const compCard = el('div', { class: 'card' },
      el('h3', { class: 'card-title' }, 'Comparación con la corrida anterior'),
    );
    if (comp) {
      const compGrid = el('div', { class: 'comparison-grid' },
        compItem('Resueltos', comp.hallazgos_resueltos, 'positive'),
        compItem('Nuevos', comp.hallazgos_nuevos, comp.hallazgos_nuevos > 0 ? 'negative' : 'neutral'),
        compItem('Mejoraron', comp.mejoraron, 'positive'),
        compItem('Empeoraron', comp.empeoraron, comp.empeoraron > 0 ? 'negative' : 'neutral'),
      );
      compCard.append(compGrid);
    } else {
      compCard.append(el('div', { style: { color: 'var(--ink-secondary)', fontSize: '13px', padding: '20px 0' } }, 'Se necesitan al menos dos corridas para comparar.'));
    }
    grid.append(compCard);
    main.append(grid);

    // Draw trend chart
    if (sv.historial?.length) {
      drawTrendChart(sv.historial);
    }
  } catch (e) {
    main.innerHTML = '';
    main.append(header, el('div', { class: 'empty-state' }, el('p', null, `Error: ${e.message}`)));
  }
}

function compItem(label, value, cls) {
  return el('div', { class: 'comp-item' },
    el('span', { class: 'comp-label' }, label),
    el('span', { class: `comp-value ${cls}` }, String(value)),
  );
}

// Qué significa cada grado y sobre qué rango de la nota PHS (0–100) se asigna.
// Los cortes son los de score/scoring.py: A>=95, B>=80, C>=60, D>=40, E<40.
const GRADOS = {
  A: { label: 'Excelente', rango: '95–100' },
  B: { label: 'Bueno',     rango: '80–94'  },
  C: { label: 'Aceptable', rango: '60–79'  },
  D: { label: 'Deficiente', rango: '40–59' },
  E: { label: 'Crítico',   rango: '0–39'   },
};

function renderDistribution(dist, total) {
  if (!dist || !total) return el('div');
  const wrap = el('div');
  const bar = el('div', { class: 'distribution-bar' });
  const grades = ['A', 'B', 'C', 'D', 'E'];
  const colors = { A: 'dist-A', B: 'dist-B', C: 'dist-C', D: 'dist-D', E: 'dist-E' };
  for (const g of grades) {
    const n = dist[g] || 0;
    if (n === 0) continue;
    const pct = (n / total * 100);
    const info = GRADOS[g];
    const seg = el('div', {
      class: colors[g], style: { flex: String(n) },
      title: `${g} · ${info.label} (nota ${info.rango}): ${n} productos (${pct.toFixed(1)}%)`,
    }, pct >= 8 ? `${g} ${n}` : (pct >= 4 ? g : ''));
    bar.append(seg);
  }
  wrap.append(bar);

  const legend = el('div', { class: 'distribution-legend' });
  for (const g of grades) {
    const n = dist[g] || 0;
    if (n === 0) continue;
    const info = GRADOS[g];
    const dotColors = { A: 'var(--positive)', B: 'var(--accent)', C: 'var(--warning)', D: '#b45309', E: 'var(--critical)' };
    legend.append(el('span', { title: `Grado ${g}: ${info.label}, nota ${info.rango} de 100` },
      el('span', { class: 'dot', style: { background: dotColors[g] } }),
      el('strong', { style: { fontWeight: '700' } }, g),
      ` · ${info.label} `,
      el('span', { style: { color: 'var(--ink-secondary)' } }, `(${info.rango})`),
      `: ${n}`
    ));
  }
  wrap.append(legend);
  wrap.append(el('div', {
    style: { fontSize: '11px', color: 'var(--ink-secondary)', marginTop: '8px', lineHeight: '1.5' },
  }, 'El grado resume la calidad de registro de cada producto según su nota (0–100): A excelente, E crítico. '
   + 'La nota baja por cada carencia (sin imagen −25, sin descripción −10, etc.). Los avisos no restan.'));
  return wrap;
}

function drawTrendChart(historial) {
  const canvas = document.getElementById('trend-chart');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.parentElement.getBoundingClientRect();
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  ctx.scale(dpr, dpr);
  const W = rect.width, H = rect.height;
  const pad = { top: 12, right: 12, bottom: 28, left: 36 };

  const points = historial.map((h, i) => ({
    x: pad.left + (i / Math.max(historial.length - 1, 1)) * (W - pad.left - pad.right),
    y: pad.top + (1 - h.salud / 100) * (H - pad.top - pad.bottom),
    salud: h.salud,
    date: h.medido_en,
  }));

  // Grid lines
  const style = getComputedStyle(document.documentElement);
  const gridColor = style.getPropertyValue('--border').trim();
  const textColor = style.getPropertyValue('--ink-secondary').trim();
  const accentColor = style.getPropertyValue('--accent').trim();

  ctx.strokeStyle = gridColor;
  ctx.lineWidth = 1;
  for (const v of [0, 25, 50, 75, 100]) {
    const y = pad.top + (1 - v / 100) * (H - pad.top - pad.bottom);
    ctx.beginPath();
    ctx.moveTo(pad.left, y);
    ctx.lineTo(W - pad.right, y);
    ctx.stroke();
    ctx.fillStyle = textColor;
    ctx.font = '10px Inter, system-ui';
    ctx.textAlign = 'right';
    ctx.fillText(String(v), pad.left - 6, y + 3);
  }

  // X labels
  if (points.length > 1) {
    const step = Math.max(1, Math.floor(points.length / 5));
    ctx.textAlign = 'center';
    for (let i = 0; i < points.length; i += step) {
      const p = points[i];
      if (p.date) {
        const d = new Date(p.date);
        ctx.fillStyle = textColor;
        ctx.fillText(d.toLocaleDateString('es', { day: '2-digit', month: 'short' }), p.x, H - 4);
      }
    }
  }

  // Area fill
  if (points.length > 1) {
    const gradient = ctx.createLinearGradient(0, pad.top, 0, H - pad.bottom);
    gradient.addColorStop(0, accentColor + '30');
    gradient.addColorStop(1, accentColor + '05');
    ctx.beginPath();
    ctx.moveTo(points[0].x, H - pad.bottom);
    for (const p of points) ctx.lineTo(p.x, p.y);
    ctx.lineTo(points[points.length - 1].x, H - pad.bottom);
    ctx.closePath();
    ctx.fillStyle = gradient;
    ctx.fill();
  }

  // Line
  ctx.beginPath();
  ctx.strokeStyle = accentColor;
  ctx.lineWidth = 2;
  ctx.lineJoin = 'round';
  for (let i = 0; i < points.length; i++) {
    if (i === 0) ctx.moveTo(points[i].x, points[i].y);
    else ctx.lineTo(points[i].x, points[i].y);
  }
  ctx.stroke();

  // Dots
  for (const p of points) {
    ctx.beginPath();
    ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
    ctx.fillStyle = accentColor;
    ctx.fill();
    ctx.strokeStyle = style.getPropertyValue('--card').trim();
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  // Endpoint label
  if (points.length) {
    const last = points[points.length - 1];
    ctx.fillStyle = accentColor;
    ctx.font = 'bold 12px "DM Sans", system-ui';
    ctx.textAlign = 'center';
    ctx.fillText(String(last.salud), last.x, last.y - 10);
  }
}

async function renderFindings() {
  const main = document.getElementById('main-content');
  main.innerHTML = '';
  if (!state.tenant || state.store == null) {
    main.append(el('div', { class: 'empty-state' }, el('p', null, 'Selecciona un tenant primero.')));
    return;
  }

  main.append(
    el('div', { class: 'main-header' }, el('h1', null, `Hallazgos · ${state.tenant.name || state.tenant.code}`)),
    renderLoading()
  );

  try {
    const [data, rules] = await Promise.all([
      API.get(`/api/tenants/${state.tenant.code}/findings?store=${state.store}`),
      API.get(`/api/tenants/${state.tenant.code}/rules?store=${state.store}`).catch(() => []),
    ]);
    const ruleConfidence = new Map((rules || []).map(r => [r.id, r.confidence]));
    const loading = main.querySelector('.loading');
    if (loading) loading.remove();

    if (!data.por_deteccion?.length) {
      main.append(el('div', { class: 'empty-state' }, el('p', null, 'No hay hallazgos registrados.')));
      return;
    }

    const card = el('div', { class: 'card' });
    const maxImpact = Math.max(...data.por_deteccion.map(h => (h.hallazgos || 0) * ({ alta: 25, media: 10, baja: 5, candidato: 3, aviso: 1 }[h.severidad] || 1)));

    const table = el('table', { class: 'findings-table' });
    table.append(el('thead', null, el('tr', null,
      el('th', null, 'Hallazgo'),
      el('th', null, 'Origen'),
      el('th', null, 'Severidad'),
      el('th', null, 'Afectados'),
      el('th', null, 'Evaluados'),
      el('th', null, '%'),
      el('th', null, 'Impacto'),
    )));

    const tbody = el('tbody');
    const weights = { alta: 25, media: 10, baja: 5, candidato: 3, aviso: 1 };
    const sorted = [...data.por_deteccion].sort((a, b) => {
      const ia = (a.hallazgos || 0) * (weights[a.severidad] || 1);
      const ib = (b.hallazgos || 0) * (weights[b.severidad] || 1);
      return ib - ia;
    });

    for (const h of sorted) {
      const impact = (h.hallazgos || 0) * (weights[h.severidad] || 1);
      const impactPct = maxImpact ? (impact / maxImpact * 100) : 0;
      const impactColor = h.severidad === 'alta' ? 'var(--critical)' : h.severidad === 'media' ? 'var(--warning)' : 'var(--accent)';

      const origenBadge = el('span', { class: `severity-badge origen-${h.origen === 'regla' ? 'regla' : 'detector'}` }, h.origen === 'regla' ? 'regla' : 'detector');
      const conf = h.origen === 'regla' && h.rule_id != null ? ruleConfidence.get(h.rule_id) : null;
      const origenCell = el('td', null,
        origenBadge,
        conf != null ? el('div', { class: 'rule-draft-note' }, `confianza regla: ${Math.round(conf * 100)}%`) : null,
      );

      tbody.append(el('tr', null,
        el('td', { style: { fontWeight: '500' } }, etiquetaCodigo(h.code)),
        origenCell,
        el('td', null, el('span', { class: `severity-badge ${sevClass(h.severidad)}` }, h.severidad)),
        el('td', null, String(h.hallazgos)),
        el('td', null, h.evaluados != null ? String(h.evaluados) : '—'),
        el('td', null, h.porcentaje != null ? `${h.porcentaje}%` : '—'),
        el('td', null,
          el('div', { class: 'impact-bar' },
            el('div', { class: 'impact-bar-fill', style: { width: `${impactPct}%`, background: impactColor } })
          )
        ),
      ));
    }
    table.append(tbody);
    card.append(table);
    main.append(card);

    // Coverage summary
    if (data.exclusiones && Object.keys(data.exclusiones).length) {
      const excCard = el('div', { class: 'card', style: { marginTop: '16px' } },
        el('h3', { class: 'card-title' }, 'Exclusiones de cobertura'),
      );
      for (const [det, motivo] of Object.entries(data.exclusiones)) {
        excCard.append(el('div', { style: { fontSize: '13px', marginBottom: '6px' } },
          el('strong', null, LABELS[det] || det), `: ${motivo}`
        ));
      }
      main.append(excCard);
    }
  } catch (e) {
    main.innerHTML = '';
    main.append(el('div', { class: 'empty-state' }, el('p', null, `Error: ${e.message}`)));
  }
}

function toast(msg, isError = false) {
  let t = document.getElementById('skudo-toast');
  if (!t) { t = el('div', { id: 'skudo-toast', class: 'toast' }); document.body.append(t); }
  t.textContent = msg;
  t.className = 'toast show' + (isError ? ' toast-error' : '');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => { t.className = 'toast'; }, 3200);
}

const CURATION_ROLES = ['superadmin', 'administrador', 'aprobador'];

// Qué acciones ofrece una regla según su estado y origen. El backend y la
// máquina de estados son la autoridad; esto sólo evita mostrar botones que
// darían 409. Un piso externo nunca se rechaza (sólo se acota).
function accionesDeRegla(r) {
  const piso = r.origin === 'piso_externo';
  if (r.status === 'borrador')
    return [{ tipo: 'accept', label: 'Aceptar', clase: 'btn-accept' },
            { tipo: 'reject', label: 'Rechazar', clase: 'btn-reject' }];
  if (r.status === 'aceptada') {
    const a = [{ tipo: 'limit', label: 'Acotar', clase: 'btn-limit' }];
    if (!piso) a.push({ tipo: 'reject', label: 'Rechazar', clase: 'btn-reject' });
    return a;
  }
  if (r.status === 'aviso') {
    const a = [{ tipo: 'accept', label: 'Reactivar', clase: 'btn-accept' }];
    if (!piso) a.push({ tipo: 'reject', label: 'Rechazar', clase: 'btn-reject' });
    return a;
  }
  return []; // rechazada: terminal
}

async function curarRegla(r, tipo) {
  const base = `/api/tenants/${state.tenant.code}/rules/${r.id}`;
  const attr = r.attribute || `#${r.id}`;
  try {
    if (tipo === 'accept') {
      try {
        await API.post(`${base}/accept`, {});
      } catch (e) {
        if (e.status === 409 && e.detail && e.detail.needs_confirm) {
          if (!window.confirm(`La regla de "${attr}" tiene confianza media (ambigua). ¿Aceptarla igual?`)) return;
          await API.post(`${base}/accept`, { confirmar_ambiguo: true });
        } else { throw e; }
      }
    } else if (tipo === 'reject') {
      const motivo = window.prompt(`Motivo para rechazar la regla de "${attr}":`, '');
      if (motivo == null || !motivo.trim()) return;
      await API.post(`${base}/reject`, { motivo });
    } else if (tipo === 'limit') {
      const motivo = window.prompt(`Motivo para acotar a aviso la regla de "${attr}":`, '');
      if (motivo == null || !motivo.trim()) return;
      await API.post(`${base}/limit`, { motivo });
    }
    toast(`Regla de "${attr}" actualizada`);
    renderRules();
  } catch (e) {
    toast(`Error: ${e.message}`, true);
  }
}

async function crearSnapshot() {
  if (!window.confirm('Un snapshot congela las reglas activas actuales para reproducir la próxima evaluación. ¿Crearlo?')) return;
  try {
    const res = await API.post(`/api/tenants/${state.tenant.code}/rules/snapshot?store=${state.store}`, {});
    toast(`Snapshot v${res.version} con ${res.rule_count} reglas activas`);
  } catch (e) {
    toast(`Error: ${e.message}`, true);
  }
}

// --- Crear una regla a mano (origin curada) --------------------------------
async function crearRegla(form) {
  const kind = form.querySelector('[name=kind]').value;
  const attribute = form.querySelector('[name=attribute]').value.trim();
  const [scope_kind, scope_key] = form.querySelector('[name=alcance]').value.split(':');
  if (!attribute) { toast('Poné un atributo', true); return; }
  const payload = { kind, attribute, scope_kind, scope_key: scope_key || null };
  if (kind === 'rango') {
    payload.minimo = parseFloat(form.querySelector('[name=minimo]').value);
    payload.maximo = parseFloat(form.querySelector('[name=maximo]').value);
    if (Number.isNaN(payload.minimo) || Number.isNaN(payload.maximo)) {
      toast('Rango: poné un mínimo y un máximo numéricos', true); return;
    }
  }
  try {
    await API.post(`/api/tenants/${state.tenant.code}/rules?store=${state.store}`, payload);
    toast(`Regla de "${attribute}" creada (en borrador para curar)`);
    renderRules();
  } catch (e) {
    toast(`Error: ${e.message}`, true);
  }
}

// Identifica un attribute set: nombre real de Magento si está sincronizado; si
// no, una huella (N productos · atributos más presentes) para reconocerlo.
function etiquetaSet(sid, setInfo) {
  const info = (setInfo || {})[String(sid)] || {};
  const partes = [];
  if (info.productos != null) partes.push(`${info.productos} producto${info.productos === 1 ? '' : 's'}`);
  if (info.atributos && info.atributos.length) partes.push(info.atributos.join(', '));
  const titulo = partes.join(' · ') || `attribute set ${sid}`;
  const corto = info.name ? info.name : `Set ${sid}${info.productos != null ? ` (${info.productos})` : ''}`;
  return { corto, titulo };
}

function alcanceCelda(scope, setInfo) {
  const base = { style: { color: 'var(--ink-secondary)', fontSize: '12px' } };
  if (!scope) return el('td', base, '—');
  const i = scope.indexOf(':');
  const kind = i >= 0 ? scope.slice(0, i) : scope;
  const key = i >= 0 ? scope.slice(i + 1) : '';
  if (kind === 'attribute_set') {
    const { corto, titulo } = etiquetaSet(key, setInfo);
    return el('td', { ...base, title: titulo }, corto);
  }
  if (kind === 'global') return el('td', base, 'Global');
  return el('td', base, scope.replace(':', ' · '));
}

function construirFormNuevaRegla(setInfo) {
  const datalist = el('datalist', { id: 'skudo-attrs' });
  const attribute = el('input', { name: 'attribute', list: 'skudo-attrs', autocomplete: 'off',
    placeholder: 'ej. color, ean_13, peso… (elegí o escribí)' });

  const rangoRow = el('div', { class: 'form-row rango-row' },
    el('label', null, 'Mínimo', el('input', { name: 'minimo', type: 'number', step: 'any' })),
    el('label', null, 'Máximo', el('input', { name: 'maximo', type: 'number', step: 'any' })),
  );
  rangoRow.hidden = true;

  const tipo = el('select', { name: 'kind', onchange: () => { rangoRow.hidden = tipo.value !== 'rango'; } },
    el('option', { value: 'obligatoriedad' }, 'Obligatorio (debe estar cargado)'),
    el('option', { value: 'rango' }, 'Rango (valor entre mínimo y máximo)'),
  );

  const alcance = el('select', { name: 'alcance' },
    el('option', { value: 'global:' }, 'Global (toda la tienda)'),
  );
  for (const sid of Object.keys(setInfo || {}).sort((a, b) => Number(a) - Number(b))) {
    const { corto, titulo } = etiquetaSet(sid, setInfo);
    alcance.append(el('option', { value: `attribute_set:${sid}`, title: titulo },
      (setInfo[sid] && setInfo[sid].name) ? corto : `${corto} — ${titulo}`));
  }

  const form = el('form', { class: 'nueva-regla-form',
    onsubmit: (e) => { e.preventDefault(); crearRegla(form); } },
    el('div', { class: 'form-row' },
      el('label', null, 'Tipo', tipo),
      el('label', { class: 'grow' }, 'Atributo', attribute, datalist),
      el('label', null, 'Alcance', alcance),
    ),
    rangoRow,
    el('div', { class: 'form-actions' },
      el('button', { type: 'submit', class: 'rule-btn btn-accept' }, 'Crear regla'),
      el('button', { type: 'button', class: 'rule-btn',
        onclick: () => { form.hidden = true; } }, 'Cancelar'),
    ),
  );
  form.hidden = true;

  // Poblá el datalist de atributos reales (una vez). Los sets ya vienen en el
  // desplegable desde set-info; el atributo igual se puede escribir a mano.
  let cargado = false;
  form._mostrar = async () => {
    form.hidden = !form.hidden;
    if (form.hidden || cargado) return;
    cargado = true;
    try {
      const op = await API.get(`/api/tenants/${state.tenant.code}/rules/opciones?store=${state.store}`);
      for (const a of (op.atributos || [])) datalist.append(el('option', { value: a.code }, a.label || a.code));
    } catch { /* el atributo se puede escribir a mano igual */ }
  };
  return form;
}

async function renderRules() {
  const main = document.getElementById('main-content');
  main.innerHTML = '';
  if (!state.tenant || state.store == null) {
    main.append(el('div', { class: 'empty-state' }, el('p', null, 'Selecciona un tenant primero.')));
    return;
  }

  const canCurate = puedeCurar();
  const header = el('div', { class: 'main-header' }, el('h1', null, `Reglas · ${state.tenant.name || state.tenant.code}`));
  // Identificación de los attribute sets (nombre real si existe, si no huella).
  let setInfo = {};
  try { setInfo = await API.get(`/api/tenants/${state.tenant.code}/rules/set-info?store=${state.store}`); } catch { setInfo = {}; }
  const formNueva = canCurate ? construirFormNuevaRegla(setInfo) : null;
  if (canCurate) {
    header.append(
      el('button', { class: 'btn-nueva', onclick: () => formNueva._mostrar() }, '+ Nueva regla'),
      el('button', { class: 'btn-snapshot', onclick: crearSnapshot }, 'Crear snapshot'),
    );
  }
  main.append(header, el('p', { class: 'section-intro' },
    'Las reglas son las expectativas de calidad con que Skudo mide tu catálogo. Acá revisás las que propone y decidís cuáles valen.'),
    reglasAyuda(canCurate));
  if (formNueva) main.append(formNueva);
  main.append(renderLoading());

  try {
    const rules = await API.get(`/api/tenants/${state.tenant.code}/rules?store=${state.store}`);
    const loading = main.querySelector('.loading');
    if (loading) loading.remove();

    if (!rules?.length) {
      main.append(el('div', { class: 'empty-state' }, el('p', null, 'No hay reglas para esta store view.')));
      return;
    }

    // Resumen por estado: cuántas hay para curar vs. ya activas.
    const cuenta = {};
    for (const r of rules) cuenta[r.status] = (cuenta[r.status] || 0) + 1;
    const resumen = el('div', { class: 'rules-summary' });
    for (const [estado, n] of Object.entries(cuenta)) {
      resumen.append(el('span', { class: `severity-badge rule-status-${estado}` }, `${n} ${estado}`));
    }
    main.append(resumen);

    // Borradores primero (lo que hay para curar), luego por impacto observado.
    const orden = { borrador: 0, aceptada: 1, aviso: 2, rechazada: 3 };
    const sorted = [...rules].sort((a, b) =>
      (orden[a.status] - orden[b.status]) || ((b.productos_marcados || 0) - (a.productos_marcados || 0)));

    const card = el('div', { class: 'card' });
    const table = el('table', { class: 'findings-table' });
    const headRow = el('tr', null,
      el('th', { title: 'El campo del producto sobre el que mira la regla.' }, 'Atributo'),
      el('th', { title: 'Qué controla: Obligatorio (debe estar cargado), Rango (valor entre min y max) o Formato (valor mal escrito).' }, 'Tipo'),
      el('th', { title: 'A qué grupo de productos aplica (por ejemplo, un attribute set).' }, 'Alcance'),
      el('th', { title: 'De dónde salió: inferida de tu catálogo o piso mínimo de Google.' }, 'Origen'),
      el('th', { title: 'Qué tan seguro está Skudo de la regla, según tu catálogo.' }, 'Confianza'),
      el('th', { title: 'Cuántos productos miró Skudo para proponer la regla.' }, 'Evidencia'),
      el('th', { title: 'Cuántos productos NO cumplen la regla en la última medición.' }, 'Productos marcados'),
      el('th', { title: 'En qué punto del ciclo está la regla.' }, 'Estado'),
    );
    if (canCurate) headRow.append(el('th', null, 'Acciones'));
    table.append(el('thead', null, headRow));

    const tbody = el('tbody');
    for (const r of sorted) {
      const dim = r.status === 'rechazada';
      const pct = Math.round((r.confidence || 0) * 100);

      const estadoCell = el('td', null,
        el('span', { class: `severity-badge rule-status-${r.status}`, title: ESTADO_INFO[r.status] || '' }, r.status),
        r.ambiguo ? el('div', { class: 'rule-draft-note', title: 'Confianza media: Skudo no está del todo seguro, conviene revisarla antes de aceptar.' }, 'ambigua') : null,
      );

      const cells = [
        el('td', { style: { fontWeight: '500' } }, r.attribute || '—'),
        el('td', { title: (TIPO_INFO[r.kind] || {}).desc || '' }, tipoLabel(r.kind)),
        alcanceCelda(r.scope, setInfo),
        el('td', null, el('span', { class: `severity-badge origin-${r.origin}`, title: ORIGEN_INFO[r.origin] || '' }, (r.origin || '—').replace('_', ' '))),
        el('td', null,
          el('div', { style: { display: 'flex', alignItems: 'center', gap: '8px' } },
            el('div', { class: 'impact-bar' }, el('div', { class: 'impact-bar-fill', style: { width: `${pct}%`, background: 'var(--accent)' } })),
            el('span', { style: { fontSize: '12px', color: 'var(--ink-secondary)' } }, `${pct}%`),
          ),
        ),
        el('td', null, r.evidence_count != null ? String(r.evidence_count) : '—'),
        el('td', null, String(r.productos_marcados || 0)),
        estadoCell,
      ];
      if (canCurate) {
        const acc = el('div', { class: 'rule-actions' });
        const acciones = accionesDeRegla(r);
        if (!acciones.length) {
          acc.append(el('span', { style: { color: 'var(--ink-secondary)', fontSize: '12px' } }, '—'));
        }
        for (const a of acciones) {
          acc.append(el('button', { class: `rule-btn ${a.clase}`, onclick: () => curarRegla(r, a.tipo) }, a.label));
        }
        cells.push(el('td', null, acc));
      }

      tbody.append(el('tr', dim ? { style: { opacity: '.55' } } : null, ...cells));
    }
    table.append(tbody);
    card.append(table);
    main.append(card);
  } catch (e) {
    main.innerHTML = '';
    main.append(el('div', { class: 'empty-state' }, el('p', null, `Error: ${e.message}`)));
  }
}

  let filterCritico = null;

  async function load() {
    const params = new URLSearchParams({ store: state.store, limit: 100 });
    if (filterGrado) params.set('grado', filterGrado);
    if (filterCritico != null) params.set('critico', filterCritico);
    return API.get(`/api/tenants/${state.tenant.code}/products?${params}`);
  }

  function render(data) {
    main.innerHTML = '';
    const header = el('div', { class: 'main-header' }, el('h1', null, `Productos · ${state.tenant.name || state.tenant.code}`));
    main.append(header);
    main.append(el('p', { class: 'section-intro' },
      'Los productos sin stock que Magento oculta no aparecen acá ni penalizan la nota. Los que están sin stock pero visibles se listan al final, con menor prioridad.'));

    const filters = el('div', { class: 'products-header' });
    const grades = ['A', 'B', 'C', 'D', 'E'];
    const allBtn = el('button', {
      class: `filter-btn ${filterGrado == null && filterCritico == null ? 'active' : ''}`,
      onclick: () => { filterGrado = null; filterCritico = null; refresh(); }
    }, `Todos (${data.total})`);
    filters.append(allBtn);

    for (const g of grades) {
      filters.append(el('button', {
        class: `filter-btn ${filterGrado === g ? 'active' : ''}`,
        onclick: () => { filterGrado = g; filterCritico = null; refresh(); }
      }, g));
    }
    filters.append(el('button', {
      class: `filter-btn ${filterCritico === true ? 'active' : ''}`,
      style: { color: 'var(--critical)' },
      onclick: () => { filterCritico = true; filterGrado = null; refresh(); }
    }, 'No publicables'));

    main.append(filters);

    if (!data.productos?.length) {
      main.append(el('div', { class: 'empty-state' }, el('p', null, 'Sin productos en este filtro.')));
      return;
    }

    const card = el('div', { class: 'card' });
    const table = el('table', { class: 'findings-table' });
    table.append(el('thead', null, el('tr', null,
      el('th', null, 'SKU'),
      el('th', null, 'Puntaje'),
      el('th', null, 'Grado'),
      el('th', null, 'Vitrina'),
      el('th', null, 'No publicable'),
      el('th', null, 'Deducciones'),
    )));
    const tbody = el('tbody');
    for (const p of data.productos) {
      tbody.append(el('tr', null,
        el('td', { style: { fontWeight: '500', fontFamily: 'var(--font-body)', fontSize: '13px' } }, p.sku),
        el('td', { style: { fontVariantNumeric: 'tabular-nums', fontFamily: 'var(--font-display)', fontWeight: '700' } }, String(p.puntaje)),
        el('td', null, el('span', { class: `severity-badge ${gradeClass(p.grado)}`, title: gradoTitle(p.grado), style: { fontFamily: 'var(--font-display)' } }, p.grado)),
        el('td', null, vitrinaBadge(p)),
        el('td', null, p.critico ? el('span', { style: { color: 'var(--critical)', fontWeight: '500' } }, 'Sí') : '—'),
        el('td', { style: { fontSize: '12px', color: 'var(--ink-secondary)' } },
          (p.deducciones || []).map(d => `${etiquetaCodigo(d.code)} (−${d.resta})`).join(', ') || '—'
        ),
      ));
    }
    table.append(tbody);
    card.append(table);
    main.append(card);
  }

  async function refresh() {
    main.innerHTML = '';
    main.append(renderLoading());
    render(await load());
  }

  main.append(renderLoading());
  render(await load());
}

async function renderCatalogDesign() {
  const main = document.getElementById('main-content');
  main.innerHTML = '';
  if (!state.tenant || state.store == null) {
    main.append(el('div', { class: 'empty-state' }, el('p', null, 'Selecciona un tenant primero.')));
    return;
  }
  main.append(
    el('div', { class: 'main-header' }, el('h1', null, `Diseño del catálogo · ${state.tenant.name || state.tenant.code}`)),
    el('p', { class: 'section-intro' },
      'Problemas de configuración del catálogo, no de productos: no afectan la nota, pero son de alto apalancamiento — activar un filtro hace encontrable lo que ya existe, y limpiar un set muerto ordena el catálogo.'),
    renderLoading(),
  );
  try {
    const [data, setInfo] = await Promise.all([
      API.get(`/api/tenants/${state.tenant.code}/catalog-design?store=${state.store}`),
      API.get(`/api/tenants/${state.tenant.code}/rules/set-info?store=${state.store}`).catch(() => ({})),
    ]);
    main.querySelector('.loading')?.remove();

    const setCell = (sid) => {
      const { corto, titulo } = etiquetaSet(sid, setInfo);
      return el('td', { title: titulo, style: { color: 'var(--ink-secondary)', fontSize: '12px' } }, corto);
    };
    const tabla = (headers, rows) => {
      const t = el('table', { class: 'findings-table' });
      t.append(el('thead', null, el('tr', null, ...headers.map(h => el('th', null, h)))));
      const tb = el('tbody');
      rows.forEach(r => tb.append(el('tr', null, ...r)));
      t.append(tb);
      return el('div', { class: 'card' }, t);
    };
    const seccion = (titulo, intro, contenido) => {
      const s = el('div', { style: { marginBottom: '28px' } });
      s.append(el('h2', { style: { fontSize: '1.05rem', margin: '0 0 4px' } }, titulo));
      s.append(el('p', { class: 'section-intro' }, intro));
      s.append(contenido);
      return s;
    };
    const vacio = (msg) => el('div', { class: 'empty-state' }, el('p', null, msg));

    // Sets muertos
    const sm = data.sets_muertos || [];
    main.append(seccion(
      `Sets muertos (${sm.length})`,
      'Attribute sets definidos sin un solo producto. Ensucian la curación, el admin y las estadísticas.',
      sm.length ? tabla(['Attribute set'], sm.map(s => [
        el('td', null, s.name ? s.name : `Set ${s.magento_id}`),
      ])) : vacio('No hay sets muertos. Bien.'),
    ));

    // Filtro perdido
    const fp = data.filtros_perdidos || [];
    main.append(seccion(
      `Filtros perdidos (${fp.length})`,
      'Atributos con buen dato y cobertura que NO están marcados como filtrables: productos que existen pero no se encuentran al filtrar. Candidatos a revisar (sin señal de demanda todavía).',
      !data.perfil ? vacio('Necesita un perfil. Corré el perfilador para esta store view.')
        : (fp.length ? tabla(['Atributo', 'Set', 'Cobertura', 'Productos'], fp.map(f => [
            el('td', { style: { fontWeight: '500' } }, f.attribute),
            setCell(f.attribute_set_id),
            el('td', null, `${Math.round((f.coverage || 0) * 100)}%`),
            el('td', null, String(f.presente)),
          ])) : vacio('Ningún candidato de filtro perdido.')),
    ));

    // Filtro inútil
    const fi = data.filtros_inutiles || [];
    main.append(seccion(
      `Filtros inútiles (${fi.length})`,
      'Atributos filtrables con un único valor efectivo: ofrecen un filtro de una sola opción, que no discrimina nada.',
      !data.perfil ? vacio('Necesita un perfil. Corré el perfilador para esta store view.')
        : (fi.length ? tabla(['Atributo', 'Set', 'Valor dominante', 'Concentración', 'Productos'], fi.map(f => [
            el('td', { style: { fontWeight: '500' } }, f.attribute),
            setCell(f.attribute_set_id),
            el('td', null, f.valor_dominante || '—'),
            el('td', null, f.mode_share != null ? `${Math.round(f.mode_share * 100)}%` : '—'),
            el('td', null, String(f.n_present)),
          ])) : vacio('Ningún filtro inútil.')),
    ));
  } catch (e) {
    main.innerHTML = '';
    main.append(el('div', { class: 'empty-state' }, el('p', null, `Error: ${e.message}`)));
  }
}

// --- Navigation ---

function navigate(view) {
  state.view = view;
  document.querySelectorAll('#sidebar-nav a').forEach(a => {
    a.classList.toggle('active', a.dataset.view === view);
  });
  switch (view) {
    case 'tenants': renderTenants(); break;
    case 'dashboard': renderDashboard(); break;
    case 'findings': renderFindings(); break;
    case 'rules': renderRules(); break;
    case 'products': renderProducts(); break;
    case 'catalog-design': renderCatalogDesign(); break;
  }
}

// --- Init ---

document.querySelectorAll('#sidebar-nav a').forEach(a => {
  a.addEventListener('click', () => navigate(a.dataset.view));
});

document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errEl = document.getElementById('login-error');
  const btn = document.getElementById('login-btn');
  errEl.textContent = '';
  btn.disabled = true;
  try {
    const res = await fetch(`${window.location.origin}/api/auth/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        email: document.getElementById('email').value,
        password: document.getElementById('password').value,
      }),
    });
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      throw new Error(body.detail || 'Error de autenticación');
    }
    const data = await res.json();
    API.login(data.access_token, { email: data.email, role: data.role });
    showApp();
  } catch (err) {
    errEl.textContent = err.message;
  } finally {
    btn.disabled = false;
  }
});

document.getElementById('logout-btn').addEventListener('click', () => {
  API.logout();
  showLogin();
});

function showApp() {
  document.getElementById('login-screen').hidden = true;
  document.getElementById('app').hidden = false;
  document.getElementById('user-email').textContent = API.user?.email || '';
  navigate('tenants');
}

function showLogin() {
  document.getElementById('login-screen').hidden = false;
  document.getElementById('app').hidden = true;
  document.getElementById('login-form').reset();
  document.getElementById('login-error').textContent = '';
}

// Boot
if (API.token) {
  showApp();
} else {
  showLogin();
}
</script>
